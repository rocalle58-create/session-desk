<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f">
<title>Trading Performance Cockpit</title>
<style>body{margin:0;background:#08111f;color:#e9f1fc;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:550px;padding:24px;text-align:center}a{color:#60d5d0}</style>
<div class="box"><h1>Trading Performance Cockpit</h1><p id="status">Chargement du cockpit…</p></div>
<script>
(async()=>{try{
const names=["app-v2-part-00.txt","app-v2-part-01.txt","app-v2-part-02.txt","app-v2-part-03.txt","app-v2-part-04.txt","app-v2-part-05.txt","app-v2-part-06.txt","app-v2-part-07.txt","app-v2-part-08.txt","app-v2-part-09.txt","app-v2-part-10.txt","app-v2-part-11.txt"];
const parts=await Promise.all(names.map(async n=>{const r=await fetch('./'+n+'?v=2',{cache:'no-store'});if(!r.ok)throw new Error('Fragment manquant : '+n);return (await r.text()).trim();}));
const binary=atob(parts.join(''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
const html=await new Response(stream).text();
document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent='Erreur de chargement : '+e.message;}})();
</script></html>
