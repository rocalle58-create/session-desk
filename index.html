<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111e"><title>Trading Performance Cockpit</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111e;color:#e9f1fc;font:16px system-ui}.box{max-width:560px;padding:26px;text-align:center;border:1px solid #263b56;border-radius:18px;background:#101c2d}p{color:#9aabc3}</style></head>
<body><div class="box"><h1>Trading Performance Cockpit</h1><p id="status">Chargement du cockpit…</p></div>
<script>
(async()=>{try{
const names=Array.from({length:10},(_,i)=>'cockpit-v4-part-'+String(i).padStart(2,'0')+'.txt');
const chunks=await Promise.all(names.map(async name=>{const r=await fetch('./'+name+'?v=4',{cache:'no-store'});if(!r.ok)throw new Error('Fragment introuvable : '+name);return r.text()}));
const binary=atob(chunks.join('').trim());const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
if(!('DecompressionStream' in window))throw new Error('Navigateur incompatible. Mets Chrome ou Edge à jour.');
const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
if(!html.includes('Trading Performance Cockpit')||!html.includes('embed-widget-advanced-chart.js'))throw new Error('Vérification du contenu échouée');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent='Erreur de chargement : '+e.message+'. Recharge la page dans quelques instants.';}})();
</script></body></html>
